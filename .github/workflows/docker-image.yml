name: Build and publish image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the caller's ref)
        required: false
        type: string
        default: ""
      version:
        description: Version stamped into the .NET assemblies and used as an image tag
        required: true
        type: string
      tags:
        description: Extra image tags, comma-separated (for example "latest,stable")
        required: false
        type: string
        default: ""
      push:
        description: Push the image to GHCR
        required: false
        type: boolean
        default: true
      platforms:
        description: Target platforms (for example "linux/amd64,linux/arm64")
        required: false
        type: string
        default: linux/amd64
    outputs:
      image:
        description: Full image name
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: Pushed image digest
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Lead with the tags being published: for a branch build that is the branch, which says more
    # than the internal version stamped into the assemblies.
    name: Image ${{ inputs.tags != '' && format('{0} ({1})', inputs.tags, inputs.version) || inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      # github.sha is the caller's commit, which is not the built commit when a caller passes
      # another ref, so read the revision from the checkout instead.
      - name: Resolve built commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ contains(inputs.platforms, ',') || contains(inputs.platforms, 'arm') }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute image metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAGS: ${{ inputs.tags }}
          BUILT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arrk"

          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: version is not valid SemVer: $INPUT_VERSION" >&2
            exit 1
          fi

          tags=("$INPUT_VERSION" "sha-${BUILT_SHA::7}")
          IFS=',' read -ra extra <<< "${INPUT_TAGS:-}"
          for raw in "${extra[@]}"; do
            tag="$(echo "$raw" | xargs)"
            [ -z "$tag" ] && continue
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "error: invalid image tag: $tag" >&2
              exit 1
            fi
            tags+=("$tag")
          done

          declare -A seen=()
          {
            echo "image=$IMAGE"
            echo "tags<<EOF"
            for tag in "${tags[@]}"; do
              if [ -z "${seen[$tag]:-}" ]; then
                echo "$IMAGE:$tag"
                seen[$tag]=1
              fi
            done
            echo "EOF"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Arrk
            org.opencontainers.image.description=One web UI and one config for a self-hosted media stack.
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            VERSION=${{ inputs.version }}
            VCS_REF=${{ steps.commit.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
