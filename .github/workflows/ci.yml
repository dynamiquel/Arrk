name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly Docker-backed suite, so the heavier checks do not gate every pull request.
    - cron: "0 4 * * *"
  workflow_call:
    inputs:
      docker:
        description: Also run Docker-backed tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ARRK_SKIP_LIVE_TESTS: "1"

jobs:
  build-test:
    name: Build and hermetic tests
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Restore, build and test
        run: ./scripts/ci.sh

  docker-build:
    name: Docker image build
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    # Builds the image with the same workflow releases use, but never publishes it: push is off,
    # so the job never logs in. The reusable workflow declares packages: write, and a caller has
    # to grant everything the callee declares, so the grant is repeated here. Fork pull requests
    # still run with a read-only token.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
      push: false
      platforms: linux/amd64

  docker-tests:
    name: Docker-backed tests
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_call' && inputs.docker) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Restore, build and test
        env:
          ARRK_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/ci.sh --docker
