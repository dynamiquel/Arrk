name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly Docker-backed suite, so the heavier checks do not gate every pull request.
    - cron: "0 4 * * *"
  workflow_call:
    inputs:
      docker:
        description: Also run Docker-backed tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ARRK_SKIP_LIVE_TESTS: "1"

jobs:
  build-test:
    name: Build and hermetic tests
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Restore, build and test
        run: ./scripts/ci.sh

  docker-build:
    name: Docker image build
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The publishing workflows need Buildx for multi-platform tags, cache export and
      # attestations. This job only has to prove the Dockerfile builds, so it uses the runner's
      # Docker and never logs in or pushes.
      - name: Build image
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail

          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "arrk:ci" \
            .

  docker-tests:
    name: Docker-backed tests
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_call' && inputs.docker) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Restore, build and test
        env:
          ARRK_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/ci.sh --docker
