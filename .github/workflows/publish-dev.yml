name: Publish dev image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev
  cancel-in-progress: true

jobs:
  image:
    name: Publish dev image
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[skip ci]')) }}
    uses: ./.github/workflows/docker-image.yml
    with:
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      version: 0.0.0-dev.${{ github.run_number }}.${{ github.run_attempt }}
      tags: dev
      push: true
      platforms: linux/amd64
