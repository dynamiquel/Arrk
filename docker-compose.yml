# Arrk — portable, single-service deployment.
#
# Arrk provisions and manages the whole media stack itself (arrs, players, VPN sidecar,
# reverse proxy, tunnel, downloads). This compose file therefore describes just the Arrk
# container. It is the declarative equivalent of `scripts/run-arrk.sh`.
#
# Quick start (copy this file and a .env next to your data, then):
#   docker compose up -d
#
# Everything is configurable through the environment. All values have defaults; a typical
# setup looks like:
#
#   # .env
#   ARRK_STACK_NAME=media
#   ARRK_CONTAINER_NAME=arrk-media
#   ARRK_CONFIG_DIR=/srv/arrk/config
#   ARRK_DOWNLOADS_DIR=/srv/arrk/downloads
#   ARRK_MEDIA_DIR=/srv/arrk/media
#
#   # Optional: run another tag or a local build instead of the published image.
#   # ARRK_IMAGE=ghcr.io/dynamiquel/arrk:dev
#
#   # Uncomment to publish the web UI on the host (omit for a tunnel-only stack):
#   # ARRK_HOST_PORT=5186

name: ${ARRK_CONTAINER_NAME:-arrk}

services:
  arrk:
    image: ${ARRK_IMAGE:-ghcr.io/dynamiquel/arrk:latest}
    container_name: ${ARRK_CONTAINER_NAME:-arrk}
    restart: unless-stopped
    environment:
      # Historical resource names are retained for existing installations:
      # stackarr-<name>-* containers and stackarr-<name>-net network.
      StackName: ${ARRK_STACK_NAME:-${STACKARR_STACK_NAME:-default}}
    volumes:
      # Arrk talks to the Docker daemon over the host socket to provision its services.
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep the historical default data root and accept existing .env mount overrides.
      - ${ARRK_CONFIG_DIR:-${STACKARR_CONFIG_DIR:-./stackarr-data/config}}:/config
      - ${ARRK_DOWNLOADS_DIR:-${STACKARR_DOWNLOADS_DIR:-./stackarr-data/downloads}}:/downloads
      - ${ARRK_MEDIA_DIR:-${STACKARR_MEDIA_DIR:-./stackarr-data/media}}:/media
    # Tunnel-only by default: no host ports are published. Uncomment to expose the web UI
    # locally (the reverse proxy's own ports come from routes.httpPort/httpsPort in the config).
    # ports:
    #   - "${ARRK_HOST_PORT:-5186}:5186"
    networks:
      - arrk

networks:
  arrk:
    name: stackarr-${ARRK_STACK_NAME:-${STACKARR_STACK_NAME:-default}}-net
